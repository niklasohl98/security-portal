name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format, Lint, Typen, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Gepinntes Restic-Binary für echten Verschlüsselungs-/Restore-Test
        run: |
          docker build --target restic -t kw-restic-tests .
          docker create --name kw-restic-tests kw-restic-tests
          docker cp kw-restic-tests:/usr/bin/restic "$RUNNER_TEMP/restic"
          docker rm kw-restic-tests
          echo "KW_TEST_RESTIC_BINARY=$RUNNER_TEMP/restic" >> "$GITHUB_ENV"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov

  audit:
    name: Abhängigkeitsprüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip-audit -r requirements.txt --require-hashes --disable-pip

  container:
    name: Image bauen und Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start mit Beispielkonfiguration (Platzhalterwerte)
        run: |
          cp config/tenants.example.yaml config/tenants.yaml
          docker compose up -d --build --wait --wait-timeout 90
      - name: Läuft als Nicht-root
        run: test "$(docker compose exec -T app id -u)" = "10001"
      - name: Mandanten CG und CVH angelegt
        run: docker compose exec -T app python -m app.cli tenants | tee /dev/stderr | grep -c . | grep -qx 2
      - name: Neustart mit vorhandener Datenbank (Migrationen dürfen nicht erneut laufen)
        run: |
          docker compose restart app
          docker compose up -d --no-build --wait --wait-timeout 60
          docker compose exec -T app python -m app.cli tenants | grep -c . | grep -qx 2
      - name: Entra-Abruf ohne Secret scheitert sauber (Exit 1, ohne Details)
        run: |
          set +e
          out=$(docker compose exec -T app python -m app.cli sync-entra cg 2>&1); code=$?
          echo "$out"
          test "$code" = 1 && echo "$out" | grep -q "Fehler: ConfigError"
      - name: Dateisystem schreibgeschützt
        run: "! docker compose exec -T app sh -c 'touch /srv/x' 2>/dev/null"
      - name: SBOM und vollständiger Schwachstellenbestand
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: kontenwaechter:dev
          scanners: vuln
          format: cyclonedx
          output: kontenwaechter.sbom.cdx.json
          exit-code: '0'
          timeout: 10m
      - name: Behebbare hohe und kritische Image-Befunde blockieren
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: kontenwaechter:dev
          scanners: vuln
          format: json
          output: kontenwaechter.vulnerabilities.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m
      - name: SBOM und Scanbericht aufbewahren
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-security
          path: |
            kontenwaechter.sbom.cdx.json
            kontenwaechter.vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v
