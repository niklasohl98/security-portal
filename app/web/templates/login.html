{% extends "base.html" %}
{% block title %}Anmelden - Kontenwächter{% endblock %}
{% block content %}
<h1>Anmelden</h1>
{% if error %}<p class="notice warn" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack" autocomplete="on">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Benutzername
    <input type="text" name="username" value="{{ username }}" maxlength="64" required autofocus
           autocomplete="username" autocapitalize="none" spellcheck="false"></label>
  <label>Passwort
    <input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">Anmelden</button>
</form>
{% endblock %}
