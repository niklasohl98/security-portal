# App-Dienst; HTTPS-Betrieb über Reverse-Proxy siehe docs/https-setup.md.
# Start:  cp config/tenants.example.yaml config/tenants.yaml  &&  docker compose up -d --build
services:
  app:
    build: .
    image: kontenwaechter:dev
    restart: unless-stopped
    user: "10001:10001"
    read_only: true # Dateisystem schreibgeschützt, außer /data und /tmp
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      KW_LOG_LEVEL: ${KW_LOG_LEVEL:-INFO}
      KW_SCHEDULER_ENABLED: ${KW_SCHEDULER_ENABLED:-1}
      KW_SYNC_TIME: ${KW_SYNC_TIME:-03:00}
      KW_TIMEZONE: ${KW_TIMEZONE:-Europe/Berlin}
      KW_RETENTION_DAYS: ${KW_RETENTION_DAYS:-90}
      KW_SESSION_HOURS: ${KW_SESSION_HOURS:-8}
      KW_LOGIN_MAX_ATTEMPTS: ${KW_LOGIN_MAX_ATTEMPTS:-5}
      KW_LOGIN_LOCKOUT_MINUTES: ${KW_LOGIN_LOCKOUT_MINUTES:-15}
      KW_COOKIE_SECURE: ${KW_COOKIE_SECURE:-auto}
      KW_PUBLIC_URL: ${KW_PUBLIC_URL:-}
      KW_CERTIFICATES_FILE: ${KW_CERTIFICATES_FILE:-/config/certificates.yaml}
      # Nur konkrete Proxy-IP(s)/CIDR, niemals "*". Uvicorn wertet diese Variable aus.
      FORWARDED_ALLOW_IPS: ${KW_TRUSTED_PROXY_IPS:-127.0.0.1}
      KW_SSO_ENABLED: ${KW_SSO_ENABLED:-0}
      KW_SSO_TENANT_ID: ${KW_SSO_TENANT_ID:-}
      KW_SSO_CLIENT_ID: ${KW_SSO_CLIENT_ID:-}
      KW_SSO_ALLOWED_GROUP_ID: ${KW_SSO_ALLOWED_GROUP_ID:-}
      KW_SSO_ADMIN_GROUP_ID: ${KW_SSO_ADMIN_GROUP_ID:-}
      KW_SSO_CERT_SECRET: ${KW_SSO_CERT_SECRET:-}
      KW_SSO_CERT_THUMBPRINT: ${KW_SSO_CERT_THUMBPRINT:-}
      KW_SSO_RECHECK_SECONDS: ${KW_SSO_RECHECK_SECONDS:-300}
      KW_BACKUP_TIME: ${KW_BACKUP_TIME:-02:30}
      KW_BACKUP_KEEP_DAYS: ${KW_BACKUP_KEEP_DAYS:-14}
      KW_BACKUP_WARN_HOURS: ${KW_BACKUP_WARN_HOURS:-36}
      # Externes Ziel ist noch nicht vorhanden: bleibt ausdrücklich deaktiviert.
      KW_EXTERNAL_BACKUP_ENABLED: ${KW_EXTERNAL_BACKUP_ENABLED:-0}
      KW_EXTERNAL_BACKUP_REPOSITORY: ${KW_EXTERNAL_BACKUP_REPOSITORY:-}
      KW_EXTERNAL_BACKUP_PASSWORD_SECRET: ${KW_EXTERNAL_BACKUP_PASSWORD_SECRET:-}
      KW_EXTERNAL_BACKUP_CREDENTIALS_SECRET: ${KW_EXTERNAL_BACKUP_CREDENTIALS_SECRET:-}
      KW_EXTERNAL_BACKUP_SSH_SECRET: ${KW_EXTERNAL_BACKUP_SSH_SECRET:-}
      KW_EXTERNAL_BACKUP_CA_FILE: ${KW_EXTERNAL_BACKUP_CA_FILE:-}
      KW_EXTERNAL_BACKUP_TIME: ${KW_EXTERNAL_BACKUP_TIME:-02:45}
      KW_EXTERNAL_BACKUP_TIMEOUT_SECONDS: ${KW_EXTERNAL_BACKUP_TIMEOUT_SECONDS:-1800}
      KW_EXTERNAL_BACKUP_WARN_HOURS: ${KW_EXTERNAL_BACKUP_WARN_HOURS:-36}
      KW_EXTERNAL_BACKUP_KEEP_DAILY: ${KW_EXTERNAL_BACKUP_KEEP_DAILY:-14}
      KW_EXTERNAL_BACKUP_KEEP_WEEKLY: ${KW_EXTERNAL_BACKUP_KEEP_WEEKLY:-8}
      KW_EXTERNAL_BACKUP_KEEP_MONTHLY: ${KW_EXTERNAL_BACKUP_KEEP_MONTHLY:-12}
      # Mail-Bericht über Exchange Online (leer = aus), siehe docs/mail-setup.md. Der private Schlüssel
      # des Zertifikats kommt als Docker-Secret (Name in KW_MAIL_CERT_SECRET).
      KW_MAIL_FROM: ${KW_MAIL_FROM:-}
      KW_MAIL_TENANT_ID: ${KW_MAIL_TENANT_ID:-}
      KW_MAIL_CLIENT_ID: ${KW_MAIL_CLIENT_ID:-}
      KW_MAIL_CERT_SECRET: ${KW_MAIL_CERT_SECRET:-}
      KW_MAIL_CERT_THUMBPRINT: ${KW_MAIL_CERT_THUMBPRINT:-}
      KW_REPORT_WEEKDAY: ${KW_REPORT_WEEKDAY:-}
      KW_REPORT_TIME: ${KW_REPORT_TIME:-}
    ports:
      - "127.0.0.1:8000:8000" # Backend nur für den lokalen Reverse-Proxy
    volumes:
      - kw-data:/data
      # Sicherungen der Datenbank. Vorher anlegen und freigeben (Container-Benutzer 10001):
      #   mkdir backup && sudo chown 10001:10001 backup
      # Besser ein Ordner auf einem anderen Datenträger, siehe README (Sicherung).
      - ./backup:/backup
      - ./config:/config:ro
    # Secrets (ab Phase 2): in einer lokalen docker-compose.override.yml einhängen, siehe
    # docs/entra-setup.md. Sie erscheinen unter /run/secrets/<name>.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  kw-data:
