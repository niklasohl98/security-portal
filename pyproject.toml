[project]
name = "kontenwaechter"
version = "0.1.0"
description = "Inaktive-Konten-Wächter: liest Benutzer aus Entra ID und On-Prem-AD und markiert Konten ohne Anmeldung (nur lesend)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "msal>=1.31",
    "httpx>=0.27",
    "ldap3>=2.9.1",
    "dnspython>=2.9.1",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "pip-audit>=2.7",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# E/F/I Grundregeln, B Fehlerquellen, S Sicherheit (bandit), UP Modernisierung,
# BLE ungeprüftes "except Exception", DTZ Zeitzonen, SIM/C4 Vereinfachungen, PT pytest
select = ["E", "F", "I", "B", "S", "UP", "BLE", "DTZ", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/db/migrations/*"]

[tool.coverage.report]
# Untergrenze knapp unter dem Ist-Wert des ersten grünen Stands; wird nie gesenkt.
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
# msal und ldap3 liefern keine Typinformationen
module = ["msal", "msal.*", "ldap3", "ldap3.*"]
ignore_missing_imports = true
