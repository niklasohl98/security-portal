# Beispiel für die Mandantenkonfiguration. Kopieren nach config/tenants.yaml und anpassen:
#   cp config/tenants.example.yaml config/tenants.yaml
# Alle Werte hier sind erfundene Platzhalter. Keine Geheimnisse eintragen: bei den *_secret-Feldern
# steht nur der NAME einer Datei unter /run/secrets/ (Docker-Secret), nie der Inhalt.
# Unbekannte Schlüssel brechen den Start ab.

tenants:
  - slug: cg                  # Kürzel: a-z, 0-9, '-'; eindeutig
    name: CG
    enabled: true
    entra:
      tenant_id: 00000000-0000-4000-8000-000000000001
      client_id: 00000000-0000-4000-8000-000000000002
      certificate_secret: cg_entra_cert                    # Name des Docker-Secrets (PEM, privater Schlüssel)
      certificate_thumbprint: 0123456789ABCDEF0123456789ABCDEF01234567   # SHA-1, 40 Hex-Zeichen
    ad:
      domain: cg.example.invalid
      dcs: []                          # leer = DCs per DNS-SRV finden; sonst feste Liste von Hostnamen
      bind_user: svc-kontenwaechter    # reines Lesekonto, Mitglied nur in "Domain Users"
      bind_secret: cg_ad_bind          # Name des Docker-Secrets (Passwort)
      # Optional: CA-Datei (PEM) der Domäne, relativ zu diesem Ordner. Ohne Angabe gilt der
      # Zertifikatsspeicher des Containers. Die Datei ist öffentlich, liegt aber unter config/ca/
      # (nicht im Repo, siehe docs/ad-setup.md).
      # ca_file: ca/cg-root-ca.pem
      # Optional und nur als bewusste, befristete Ausnahme: DC-Zertifikate mit RSA-Schlüssel unter
      # 2048 Bit (z. B. 1024) akzeptieren, bis einschließlich diesem Datum. Kette, Hostname und
      # Ablauf werden weiter geprüft. Danach gilt wieder die Standardstufe (ADR 0005).
      # accept_weak_dc_keys_until: 2026-12-31
    thresholds:
      inactive_days: 30
      long_inactive_days: 90
      new_account_grace_days: 14
      exception_days: 365              # Standardlaufzeit einer Ausnahme (Tage)
      exception_warn_days: 30          # Ausnahmen, die in so vielen Tagen ablaufen, werden hervorgehoben
    # Namensmuster je Kontoart (Groß-/Kleinschreibung egal, Platzhalter * und ?). Geprüft werden
    # der UPN-Teil vor dem @ und der sAMAccountName. Reihenfolge: admin, service, test, resource.
    # Vorgabe nur für admin: ["*adm*"]; eine leere Liste (admin: []) schaltet sie ab.
    account_patterns:
      service: ["svc*", "Sync_*", "dienste.*"]
      test: ["test*", "demo*"]
      # resource: ["besucher", "wc"]    # Postfächer/Ressourcen ohne Anmeldung

    # Empfänger des Wochenberichts (nur Kennzahlen, keine Konten). Leer oder weglassen = kein Bericht.
    # Der Mailversand selbst wird über KW_SMTP_* eingerichtet, siehe README.
    # report:
    #   recipients: ["it@example.com"]

  - slug: cvh
    name: CVH
    enabled: true
    entra:
      tenant_id: 00000000-0000-4000-8000-000000000003
      client_id: 00000000-0000-4000-8000-000000000004
      certificate_secret: cvh_entra_cert
      certificate_thumbprint: 89ABCDEF0123456789ABCDEF0123456789ABCDEF
    ad:
      domain: cvh.example.invalid
      dcs: []
      bind_user: svc-kontenwaechter
      bind_secret: cvh_ad_bind
      # ca_file: ca/cvh-root-ca.pem
    # thresholds weggelassen: es gelten die Standardwerte (30 / 90 / 14 Tage)
