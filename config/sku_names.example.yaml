# Eigene Korrekturen zu den SKU-Namen. Das Tool liefert bereits einen Katalog mit allen
# Microsoft-SKUs mit (app/data/sku_catalog.yaml, aus Microsofts Referenztabelle "Product names and
# service plan identifiers for licensing"). Diese Datei ist nur nötig, wenn ein Name anders heißen
# soll oder eine SKU anders als im Katalog als kostenlos oder bezahlt gelten soll.
# Kopieren nach config/sku_names.yaml; Einträge hier haben Vorrang (gleiche Teilenummer = diese
# Datei gewinnt). Unbekannte SKUs erscheinen mit ihrer Teilenummer.
#
# free: true  = kostenlos oder Testversion: zählt nicht als Lizenz, fehlt in "freiwerdende Lizenzen"
# free: false = erzwingt "bezahlt" (Standard)
#
# Beispiele (Zeichen "#" entfernen und anpassen, dabei "skus: []" unten löschen):
skus: []
#  - {part_number: SPB, name: M365 Business Premium}
#  - {part_number: POWER_BI_PRO, name: Power BI Pro, free: true}
